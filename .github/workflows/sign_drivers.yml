name: Sign Windows drivers

on:
  workflow_dispatch:
      inputs:
        driver_version:
          description: Windows driver version (e.g. 1.0.0.0)
          type: string
          required: true
        driver_directory:
          description: Driver directory in drivers/ (e.g. wrover_b_driver)
          type: string
          required: true
        catalog_file:
          description: Driver catalog file (e.g. wrover_b_driver.cat)
          type: string
          required: true
        display_name:
          description: Driver display name - for asset, tag, ... (e.g. WROVER-B)
          type: string
          required: true

jobs:
    sign-driver:
        name: Sign driver
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Sign driver catalog
              uses: espressif/release-sign@master
              with:
                path: ./drivers/${{ inputs.driver_directory }}/${{ inputs.catalog_file }}
                azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
                azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
                azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                azure-keyvault-uri: ${{ secrets.AZURE_KEYVAULT_URI }}
                azure-keyvault-cert-name: ${{ secrets.AZURE_KEYVAULT_CERT_NAME }}

            - name: Compress files to ZIP
              run: |
                python - <<'PY'
                import os
                import zipfile
                from pathlib import Path

                driver_dir = Path("drivers") / os.environ["DRIVER_DIRECTORY"]
                zip_path = Path("drivers") / os.environ["ZIP_NAME"]
                with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
                    for file_path in driver_dir.rglob("*"):
                        if file_path.is_file():
                            archive.write(file_path, file_path.relative_to(driver_dir))
                print(f"Created {zip_path}")
                PY
              env:
                DRIVER_DIRECTORY: ${{ inputs.driver_directory }}
                ZIP_NAME: ${{ inputs.display_name }}-v${{ inputs.driver_version }}.zip

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: ${{ inputs.display_name }}_v${{ inputs.driver_version }}
                name: ${{ inputs.display_name }} driver ${{ inputs.driver_version }}
                draft: true
                prerelease: false
                fail_on_unmatched_files: true
                files: drivers/${{ inputs.display_name }}-v${{ inputs.driver_version }}.zip
