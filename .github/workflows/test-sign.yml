name: Test Signing

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  create-test-file:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      
      - name: Create test files
        run: |
          mkdir -p test
          
          # PowerShell script (.ps1)
          # This verifies that Windows binary files can probably be signed
          cat > test/test.ps1 << 'EOF'
          # Test PowerShell Script
          Write-Host "Hello World"
          Get-Date
          EOF
          
          # JAR file (.jar)
          mkdir -p jar_content/META-INF
          echo "Manifest-Version: 1.0" > jar_content/META-INF/MANIFEST.MF
          echo "Created-By: Test" >> jar_content/META-INF/MANIFEST.MF
          jar cf test/test.jar -C jar_content .
          
          echo "=== Test files created ==="
          ls -la test/
      
      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: test-unsigned
          path: test/

  sign:
    needs: create-test-file
    uses: ./.github/workflows/sign-artifacts.yml
    with:
      artifact-name: test-unsigned
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_KEYVAULT_URI: ${{ secrets.AZURE_KEYVAULT_URI }}
      AZURE_KEYVAULT_CERT_NAME: ${{ secrets.AZURE_KEYVAULT_CERT_NAME }}
      AZURE_KEYVAULT_CERTCHAIN: ${{ secrets.AZURE_KEYVAULT_CERTCHAIN }}

  verify:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: test-unsigned-signed
          path: ./signed
      
      - name: Display results
        run: |
          echo "=== Signed files ==="
          ls -la ./signed/
          echo "✅ Test sign success!"

